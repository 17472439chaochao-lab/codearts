[package]
name = "codearts-desktop"
version = "0.1.1"
description = "CodeArts Desktop shell"
authors = ["wuchengchao"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "codearts_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
base64 = "0.22"
# 未签名 dev 二进制用不了钥匙串（写入后回读 NoEntry），凭据统一存 0600 文件
rand = "0.8"
futures-util = "0.3"
tokio = { version = "1", features = ["process", "time", "io-util", "sync", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "charset"] }
# $HOME 可能被 FlyEnv 等改掉；getpwuid 才是进程所属用户的真实家目录
libc = "0.2"

# 本地 Vision OCR：截图没有视觉模型时，用 macOS 自带框架把文字读出来
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-vision = "0.3"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
