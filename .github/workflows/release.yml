name: 构建并发布安装包

# 触发方式：
# 1. 推送 v* 标签（如 git tag v0.1.9 && git push origin v0.1.9）：自动构建 macOS + Windows 并发布到 GitHub Releases
# 2. 手动触发（Actions → 构建并发布安装包 → Run workflow）：构建双端安装包并上传到 Artifacts
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      draft_release:
        description: "是否为当前提交创建 Draft Release（留空 tag 则仅上传 Artifacts）"
        type: boolean
        default: false
      release_tag:
        description: "手动发布时的标签名（如 v0.1.9，仅勾选 draft_release 时生效）"
        type: string
        default: ""

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS Universal
            os: macos-latest
            artifact_name: codearts-desktop-macos-universal
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            bundle_paths: |
              src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          - label: Windows x64
            os: windows-latest
            artifact_name: codearts-desktop-windows-x64
            rust_targets: ""
            bundle_paths: |
              src-tauri/target/release/bundle/nsis/*.exe
              src-tauri/target/release/bundle/msi/*.msi
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri bundle
        run: npm run tauri build

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.bundle_paths }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.draft_release && inputs.release_tag != '')
    runs-on: ubuntu-latest
    steps:
      - name: Download all installer artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: List release assets
        run: find release-assets -type f -exec ls -lh {} +

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.release_tag }}
          name: CodeArts CLI Desktop ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.release_tag }}
          draft: ${{ github.event_name == 'workflow_dispatch' }}
          generate_release_notes: true
          files: |
            release-assets/**/*.dmg
            release-assets/**/*.exe
            release-assets/**/*.msi
