<!doctype html>
<!--
  首屏向导的浏览器预览台：用 @tauri-apps/api/mocks 顶掉 Rust IPC，
  不装 CLI、不改本机配置也能看 Setup 的每种状态。
  仅开发期看样式用：vite build 的入口只有 index.html，这个文件不会进包。
  先起着 npm run tauri dev（或 npm run dev），然后浏览器打开
    /preview-setup.html            全新机器：三项全空
    /preview-setup.html?state=cli  只缺码道 CLI
    /preview-setup.html?state=cred 装了 CLI、缺凭据
    /preview-setup.html?state=dir  只差项目目录
    /preview-setup.html?state=ready 三项齐了（进主界面，作对照）
    /preview-setup.html?state=task 内核在线，会话正在跑 task 子任务
      进主界面后点侧栏「示例会话 A」，再用 window.__replay(400) 放子会话的事件帧；
      待决区还会带一张子会话的授权卡和反问卡，window.__kidPend(600) 看它们实时弹出来
    /preview-setup.html?state=ask 内核在线，会话卡在 question 工具上，composer 上方出题
      选完点「提交回答」，body 会存到 window.__lastAnswer 并回放 question.replied 帧
    /preview-setup.html?state=todo 内核在线，会话里有一张 todowrite 卡 + 轮末小结胶囊带清单进度
      window.__advance(900) 会连发 5 帧 todo.updated，看胶囊里的清单一路走到全部完成
    /preview-setup.html?state=stream 内核在线，一条会话里凑齐 agent/subtask/patch/retry/compaction 各类 part
      window.__live(900) 把新接入的事件连着放一遍：busy→retry 状态、压缩提示、新版本提示、
      危险命令横幅、file.edited 脉冲（跑着的胶囊小点跟着跳），最后回 idle；
      展开胶囊能看到每一步一行摘要（跑着的那步实时变成"执行 xx · yy"），点一行跳回那条消息
      window.__rename() 改名、window.__removeMsg() 撤消息，看 session.updated / message.removed 即时生效
      window.__bridge("down") 再 window.__bridge("open")，看事件流横幅与重连后的自动补齐
      侧栏会话行上的 × 连点两次走完「删除二次确认」，外层列表用它验证 session.deleted 的清理
-->

              id: "prt_t5",
              type: "tool",
              sessionID: PARENT,
              messageID: "msg_s5",
              callID: "call_t5",
              tool: "edit",
              state: {
                status: "completed",
                input: { filePath: "/Users/you/work/demo/CHANGELOG.md" },
                title: "CHANGELOG.md",
                output: "written",
                time: { start: now - 448000, end: now - 445000 },
              },
            },
            {
              id: "prt_st5",
              type: "text",
              text: "变更日志里补了一行废弃说明。",
              sessionID: PARENT,
              messageID: "msg_s5",
            },
          ],
        },
      ];

      // 子会话的历史：重开会话时靠 children + message 两个接口回灌，卡片不该是空的
      const kidMsgs = [
        {
          info: { id: "kmsg_1", role: "user", sessionID: KID, time: { created: now - 40000 } },
          parts: [
            {
              id: "kprt_ku",
              type: "text",
              sessionID: KID,
              messageID: "kmsg_1",
              text: "找出商户管理中判定超管/业务员的代码位置",
            },
          ],
        },
        {
          info: {
            id: "kmsg_2",
            role: "assistant",
            sessionID: KID,
            time: { created: now - 39000 },
            agent: "explore",
          },
          parts: [
            { id: "kprt_s1", type: "step-start", sessionID: KID, messageID: "kmsg_2" },
            {
              id: "kprt_x1",
              type: "text",
              text: "先看根目录，再定位 Merchant 相关实现。",
              sessionID: KID,
              messageID: "kmsg_2",
            },
            kidPart("kprt_t1", {
              tool: "bash",
              state: {
                status: "completed",
                input: { command: "ls app" },
                title: "查看项目根目录结构",
                output: "Interfaces\nModels\nServices",
                time: { start: now - 30000, end: now - 29000 },
              },
            }),
            kidPart("kprt_t2", {
              tool: "grep",
              state: {
                status: "completed",
                input: { pattern: "超管|业务员|is_admin" },
                title: "超管|业务员|is_admin",
                output: "app/Services/Merchants/MerchantManagerService.php:88",
                time: { start: now - 26000, end: now - 24000 },
              },
            }),
          ],
        },
      ];

      /** 子会话按内核真实节奏推过来的帧，__replay 会逐条 emit */
      const kidFrames = [
        ["message.updated", { sessionID: KID, info: { id: "kmsg_1", role: "user", sessionID: KID, time: { created: now - 40000 } } }],
        ["message.updated", { sessionID: KID, info: { id: "kmsg_2", role: "assistant", sessionID: KID, time: { created: now - 39000 }, agent: "explore", modelID: "deepseek-v3", providerID: "huawei" } }],
        ["message.part.updated", { sessionID: KID, part: { id: "kprt_s1", type: "step-start", sessionID: KID, messageID: "kmsg_2" } }],
        ["message.part.updated", { sessionID: KID, part: { id: "kprt_r1", type: "reasoning", text: "", sessionID: KID, messageID: "kmsg_2", time: { start: now - 39000 } } }],
        ["message.part.delta", { sessionID: KID, messageID: "kmsg_2", partID: "kprt_r1", field: "text", delta: "商户管理的身份判定大概率在 MerchantManagerService 里，先看目录结构。" }],
        ["message.part.updated", { sessionID: KID, part: { id: "kprt_x1", type: "text", text: "先看根目录，再定位 Merchant 相关实现。", sessionID: KID, messageID: "kmsg_2" } }],
        ["message.part.updated", { sessionID: KID, part: kidPart("kprt_t1", { tool: "bash", state: { status: "running", input: { command: "ls app" }, title: "查看项目根目录结构", time: { start: now - 30000 } } }) }],
        ["message.part.updated", { sessionID: KID, part: kidPart("kprt_t1", { tool: "bash", state: { status: "completed", input: { command: "ls app" }, title: "查看项目根目录结构", output: "Interfaces\nModels\nServices", metadata: { truncated: false }, time: { start: now - 30000, end: now - 29000 } } }) }],
        ["message.part.updated", { sessionID: KID, part: kidPart("kprt_t2", { tool: "grep", state: { status: "running", input: { pattern: "超管|业务员|is_admin" }, title: "超管|业务员|is_admin", time: { start: now - 26000 } } }) }],
        ["message.part.updated", { sessionID: KID, part: kidPart("kprt_t2", { tool: "grep", state: { status: "completed", input: { pattern: "超管|业务员|is_admin" }, title: "超管|业务员|is_admin", output: "app/Services/Merchants/MerchantManagerService.php:88", time: { start: now - 26000, end: now - 24000 } } }) }],
        ["message.part.updated", { sessionID: KID, part: kidPart("kprt_t3", { tool: "read", state: { status: "running", input: { filePath: "/Users/you/work/demo/app/Services/Merchants/MerchantManagerService.php" }, title: "app/Services/Merchants/MerchantManagerService.php", time: { start: now - 20000 } } }) }],
        ["session.status", { sessionID: PARENT, status: { type: "busy" } }],
      ];

      window.__replay = (gap = 400) => {
        kidFrames.forEach(([type, properties], i) =>
          setTimeout(() => emit("kernel-event", { type, properties }), i * gap),
        );
        return kidFrames.length;
      };
      window.__emit = (type, properties) => emit("kernel-event", { type, properties });

      /** 子会话在跑的中途抛出的待决帧：先看审批、再看反问，都带 KID */
      const kidPendFrames = [
        ["permission.asked", kidPermReq],
        ["question.asked", kidAskReq],
      ];
      window.__kidPend = (gap = 600) => {
        kidPendFrames.forEach(([type, properties], i) =>
          setTimeout(() => emit("kernel-event", { type, properties }), i * gap),
        );
        return kidPendFrames.length;
      };

      /**
       * 放一遍内核覆盖式推送：window.__advance(900) 会连着发 5 帧 todo.updated，
       * 看轮末胶囊里的清单进度一路走到全部完成。
       */
      window.__advance = (gap = 900) => {
        const at = (doneThrough) =>
          todoList.map((t, i) => ({
            ...t,
            status: i === 4 ? "cancelled" : i < doneThrough ? "completed" : i === doneThrough ? "in_progress" : "pending",
          }));
        const steps = [todoList.map((t) => ({ ...t, status: "pending" })), at(0), at(2), at(3), at(6)];
        steps.forEach((todos, i) =>
          setTimeout(() => emit("kernel-event", { type: "todo.updated", properties: { sessionID: PARENT, todos } }), i * gap),
        );
        return steps.length;
      };

      /**
       * stream 场景的连播：busy→retry、压缩、新版本、危险命令、文件脉冲、回 idle。
       * 每一帧都对应壳里一个刚落地的处理分支，跑一遍就等于把新接入的事件过一遍。
       */
      const liveFrames = [
        ["session.status", { sessionID: PARENT, status: { type: "busy" } }],
        [
          "session.status",
          { sessionID: PARENT, status: { type: "retry", attempt: 2, message: "上游返回 429，2 秒后重试" } },
        ],
        ["session.compacted", { sessionID: PARENT }],
        ["installation.update-available", { version: "26.10.1" }],
        [
          "bash.dangerous.command.detected",
          { command: "rm -rf ~/Documents", message: "内核检测到可能造成不可恢复删除的命令，已拦下等授权" },
        ],
        // 跑着的胶囊小点跟着改动脉冲，idle 后落回「✓ 步骤 N / N」
        ["file.edited", {}],
        ["file.edited", {}],
        ["session.status", { sessionID: PARENT, status: { type: "idle" } }],
      ];
      window.__live = (gap = 900) => {
        liveFrames.forEach(([type, properties], i) =>
          setTimeout(() => emit("kernel-event", { type, properties }), i * gap),
        );
        return liveFrames.length;
      };

      window.__rename = () => {
        parentTitle = "改动汇总与自动重试（已改名）";
        emit("kernel-event", {
          type: "session.updated",
          properties: {
            sessionID: PARENT,
            info: { id: PARENT, title: parentTitle, directory: projectDir, time: { created: now - 600000, updated: Date.now() } },
          },
        });
        return parentTitle;
      };

      /** 撤掉最后一条 assistant 消息；只是界面即时效果，resync 后 mock 会照旧发回来 */
      window.__removeMsg = () => {
        emit("kernel-event", { type: "message.removed", properties: { sessionID: PARENT, messageID: "msg_s3" } });
      };

      /** Rust 侧 SSE 桥的链路状态：down 出横幅，再 open 会触发一次 resync 补齐 */
      window.__bridge = (state) =>
        emit("kernel-bridge", { state, message: state === "down" ? "event stream closed" : undefined });

      mockWindows("main");
      mockIPC((cmd, payload) => {
        if (cmd === "api_request") {
          const path = payload?.path ?? "";
          if (payload?.method === "GET" && path === "/session")
            return [
              {
                id: PARENT,
                title: parentTitle,
                directory: projectDir,
                time: { created: now - 90000, updated: now },
              },
              {
                id: "ses_b1",
                title: "另一个区的会话",
                directory: otherDir,
                time: { created: now, updated: now },
              },
              ...(state === "task"
                ? [
                    {
                      id: KID,
                      title: "探索商户管理身份逻辑 (@explore subagent)",
                      parentID: PARENT,
                      directory: projectDir,
                      time: { created: now - 40000, updated: now - 40000 },
                    },
                  ]
                : []),
            ].filter((s) => !deleted.has(s.id));
          if (payload?.method === "GET" && /^\/session\/[^/]+\/children$/.test(path))
            return state === "task" && path === `/session/${PARENT}/children`
              ? [
                  {
                    id: KID,
                    title: "探索商户管理身份逻辑 (@explore subagent)",
                    parentID: PARENT,
                    directory: projectDir,
                    time: { created: now - 40000, updated: now - 40000 },
                  },
                ]
              : [];
          if (payload?.method === "GET" && path === `/session/${KID}/message`)
            return state === "task" ? kidMsgs : [];
          if (payload?.method === "GET" && path === `/session/${PARENT}/message`)
            return state === "task"
              ? parentMsgs
              : state === "ask"
                ? askMsgs
                : state === "todo"
                  ? todoMsgs
                  : state === "stream"
                    ? richMsgs
                    : [];
          if (payload?.method === "DELETE" && /^\/session\/[^/]+$/.test(path)) {
            const id = path.split("/")[2];
            deleted.add(id);
            // 真内核删完会广播 session.deleted，壳的列表/忙状态清理全靠这一帧
            window.__emit("session.deleted", { sessionID: id });
            return { id, title: parentTitle, directory: projectDir, time: { created: now, updated: now } };
          }
          if (payload?.method === "GET" && /^\/session\/[^/]+$/.test(path)) {
            const id = path.split("/")[2];
            return { id, title: parentTitle, directory: projectDir, time: { created: now, updated: now } };
          }
          if (payload?.method === "PATCH" && /^\/session\/[^/]+$/.test(path)) {
            const id = path.split("/")[2];
            // 标题兜底兜底：真内核返回更新后的 session，mock 也要保持一致
            parentTitle = String(payload?.body?.title ?? parentTitle);
            return { id, title: parentTitle, directory: projectDir, time: { created: now, updated: now } };
          }
          if (payload?.method === "POST" && /^\/session\/[^/]+\/prompt_async$/.test(path)) {
            // 粘贴截图时把 parts 留在控制台里，核对 file part 的 data URL
            window.__lastPrompt = payload?.body;
            return null;
          }
          if (payload?.method === "GET" && /^\/session\/[^/]+\/todo$/.test(path))
            return state === "todo" && path === `/session/${PARENT}/todo` ? todoList : [];
          if (payload?.method === "GET" && /^\/session\/[^/]+\/diff$/.test(path))
            return state === "stream" && path === `/session/${PARENT}/diff` ? streamDiffFull : [];
          if (payload?.method === "GET" && path === "/question")
            return [
              ...(state === "ask" ? [askReq] : []),
              ...(state === "task" ? [kidAskReq] : []),
            ];
          if (payload?.method === "POST" && /^\/question\/[^/]+\/reply$/.test(path)) {
            // 提交后把 answers 留在控制台里，方便核对协议格式
            window.__lastAnswer = payload?.body;
            const qid = path.split("/")[2];
            window.__emit("question.replied", {
              sessionID: qid === kidAskReq.id ? KID : PARENT,
              requestID: qid,
              answers: payload?.body?.answers,
            });
            return true;
          }
          if (payload?.method === "POST" && /^\/question\/[^/]+\/reject$/.test(path)) {
            const qid = path.split("/")[2];
            window.__emit("question.rejected", {
              sessionID: qid === kidAskReq.id ? KID : PARENT,
              requestID: qid,
            });
            return true;
          }
          if (payload?.method === "GET" && path === "/provider")
            return {
              all: [
                {
                  id: "huawei",
                  name: "华为云码道",
                  models: {
                    "deepseek-v3": { id: "deepseek-v3", name: "DeepSeek V3", limit: { context: 65536 } },
                  },
                },
              ],
              default: { huawei: "deepseek-v3" },
            };
          if (payload?.method === "GET" && path === "/agent")
            return [
              { name: "build", mode: "primary" },
              { name: "plan", mode: "primary" },
            ];
          if (payload?.method === "GET" && path === "/command") return [];
          if (payload?.method === "GET" && path === "/permission")
            return state === "task" ? [kidPermReq] : [];
          if (payload?.method === "GET" && path === "/permission/global") return [];
          if (payload?.method === "GET" && path === "/permission/bash/mode")
            return { mode: "always_allow" };
          if (payload?.method === "GET" && path === "/skill") return [];
          if (payload?.method === "GET" && path === "/v1/skills") return { count: 0, skills: [] };
          if (payload?.method === "GET" && path === "/mcp") return {};
          return null;
        }
        if (cmd === "env_check")
          return {
            kernelInstalled: installed,
            kernelBin: installed ? kernelBin : null,
            hasCredentials,
            projectDir: hasDir ? projectDir : null,
            projects: hasDir ? [projectDir, otherDir] : [],
            kernelHome: "/Users/you",
          };
        if (cmd === "kernel_upgrade") return "codearts upgrade\n当前已是最新版本 26.9.26";
        if (cmd === "plugin:app|version") return "0.1.1";
        if (cmd === "plugin:opener|open_url") return null;
        if (cmd === "plugin:opener|reveal_item_in_dir") return null;
        if (cmd === "settings_save") return null;
        if (cmd === "files_list") {
          if (!hasDir) return { entries: [], truncated: false };
          const rel = payload?.rel ?? "";
          return { entries: demoTree[rel] ?? [], truncated: false };
        }
        if (cmd === "file_read") {
          const rel = payload?.rel ?? "";
          if (!(rel in demoFiles)) throw new Error(`路径不存在：${rel}`);
          const content = demoFiles[rel];
          return {
            content,
            binary: false,
            truncated: false,
            size: content.length,
            mtime: now,
          };
        }
        if (cmd === "plans_list") return hasDir ? demoPlans : [];
        if (cmd === "plan_read") {
          const path = payload?.path ?? "";
          const content = demoPlanFiles[path];
          if (typeof content !== "string") throw new Error(`计划不存在：${path}`);
          return {
            content,
            binary: false,
            truncated: false,
            size: content.length,
            mtime: now,
          };
        }
        if (cmd === "kernel_status")
          return {
            running: healthy,
            healthy,
            port: healthy ? 59001 : null,
            projectDir: hasDir ? projectDir : null,
            version: healthy ? "26.9.26" : null,
            detail: null,
          };
        if (cmd === "credentials_status")
          return { saved: hasCredentials, inCliEnv: false, akMask: null };
        return null;
      }, { shouldMockEvents: true });

      await import("/src/main.tsx");
    </script>
  </body>
